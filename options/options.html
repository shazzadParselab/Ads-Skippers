<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Ad Skipper — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="page-header">
      <img src="../icons/icon48.png" alt="" class="logo" />
      <div>
        <h1>YouTube Ad Skipper</h1>
        <p class="version" id="version"></p>
      </div>
      <span class="saved" id="saved">Saved</span>
    </header>

    <main id="form">
      <!-- sections rendered by options.js from SCHEMA -->
    </main>

    <footer class="page-footer">
      <button type="button" class="btn" id="reset">Reset all settings</button>
      <p class="note">
        Changes apply immediately to open YouTube tabs — no reload needed.
      </p>
    </footer>

    <script src="../src/core/defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
