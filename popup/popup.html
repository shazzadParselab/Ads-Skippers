<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Ad Skipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="../icons/icon32.png" alt="" class="logo" />
      <h1 class="title">Ad Skipper</h1>
      <label class="switch" title="Turn everything on or off">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" data-stat="skipCount">0</span>
        <span class="stat-label">ads</span>
      </div>
      <div class="stat">
        <span class="stat-value" data-stat="segmentCount">0</span>
        <span class="stat-label">segments</span>
      </div>
      <div class="stat">
        <span class="stat-value" data-stat="timeSaved">0m</span>
        <span class="stat-label">saved</span>
      </div>
    </section>

    <section class="quick" id="quick">
      <!-- rows injected by popup.js from the QUICK list -->
    </section>

    <section class="download" id="download">
      <button type="button" class="download-toggle" id="download-toggle">
        <span class="download-icon" aria-hidden="true">&#8595;</span>
        <span id="download-toggle-label">Download this video</span>
      </button>
      <div class="download-body" id="download-body" hidden></div>
    </section>

    <footer class="footer">
      <button type="button" class="link" id="reset">Reset stats</button>
      <button type="button" class="link primary" id="options">All settings</button>
    </footer>

    <script src="../src/core/defaults.js"></script>
    <script src="popup.js"></script>
    <script src="download-ui.js"></script>
  </body>
</html>
